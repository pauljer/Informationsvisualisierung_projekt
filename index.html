<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EnergyCharts · Visual Analytics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230f172a%22%2F%3E%3Crect%20x%3D%226%22%20%20y%3D%2217%22%20width%3D%225%22%20height%3D%229%22%20%20rx%3D%221.5%22%20fill%3D%22%234fa3d1%22%2F%3E%3Crect%20x%3D%2213.5%22%20y%3D%228%22%20width%3D%225%22%20height%3D%2218%22%20rx%3D%221.5%22%20fill%3D%22%23ffd13b%22%2F%3E%3Crect%20x%3D%2221%22%20y%3D%2213%22%20width%3D%225%22%20height%3D%2213%22%20rx%3D%221.5%22%20fill%3D%22%235ba85b%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="elm"></div>
    <script src="elm.js"></script>
    <script>
        // tz = Sekunden östlich von UTC (z. B. 7200 für MESZ). Damit zeigt die App
        // Uhrzeiten in lokaler Zeit statt in UTC – sonst läge das Solar-Maximum
        // scheinbar um 10 Uhr statt mittags.
        var app = Elm.Main.init({
            node: document.getElementById("elm"),
            flags: { now: Date.now(), tz: -new Date().getTimezoneOffset() * 60 }
        });


        if (app.ports && app.ports.onScroll) {
            var ticking = false;
            window.addEventListener("scroll", function () {
                if (!ticking) {
                    window.requestAnimationFrame(function () {
                        app.ports.onScroll.send(window.scrollY || window.pageYOffset || 0);
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        }
    </script>
</body>

</html>
